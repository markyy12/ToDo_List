databases:
  - name: todo-app-db
    databaseName: todo_app
    user: todo_app
    plan: free
    region: frankfurt

services:
  - type: web
    name: todo-app
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: "bash build.sh"

    startCommand: "python -m gunicorn todo_app.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-app-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"